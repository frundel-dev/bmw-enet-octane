name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Run JVM unit tests
        run: gradle --no-daemon :core:data:test :core:diagnostics:test :feature:analysis:test :feature:benchmark:test :app:testOctaneDebugUnitTest :app:testLabDebugUnitTest

      - name: Android Lint (fatal and error checks)
        run: gradle --no-daemon :app:lintOctaneDebug :app:lintLabDebug

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleOctaneDebug :app:assembleLabDebug

      - name: Publish quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bmw-octane-quality-reports
          path: |
            app/build/test-results/test*DebugUnitTest/**
            app/build/reports/tests/test*DebugUnitTest/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            core/*/build/test-results/test/**
            feature/*/build/test-results/test/**
          if-no-files-found: warn
          retention-days: 30

      - name: Verify benchmark module excluded from OCTANE
        run: |
          gradle --no-daemon :app:dependencies --configuration octaneDebugRuntimeClasspath > /tmp/octane-deps.txt
          gradle --no-daemon :app:dependencies --configuration labDebugRuntimeClasspath > /tmp/lab-deps.txt
          if grep -F "project :feature:benchmark" /tmp/octane-deps.txt; then
            echo "FAIL: production variant includes benchmark module"
            exit 1
          fi
          grep -F "project :feature:benchmark" /tmp/lab-deps.txt || {
            echo "FAIL: LAB variant lacks benchmark module"
            exit 1
          }

      - name: Upload OCTANE APK
        uses: actions/upload-artifact@v4
        with:
          name: BMW-OCTANE-224-debug-apk
          path: app/build/outputs/apk/octane/debug/app-octane-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload LAB APK
        uses: actions/upload-artifact@v4
        with:
          name: BMW-OCTANE-LAB-224-debug-apk
          path: app/build/outputs/apk/lab/debug/app-lab-debug.apk
          if-no-files-found: error
          retention-days: 30
