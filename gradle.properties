# Experimental BMW OCTANE 2.0 build memory budget.
# D8 dexBuilderDebug exceeded the default Gradle worker heap on GitHub Actions.
# Limit workers instead of unconstrained parallel dex processing.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
